# @format

name: Deploy to server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            echo "Pulling latest images from Docker Hub"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/oldtom-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/oldtom-frontend:latest
            echo "Stopping old compose and starting new"
            cd /opt/oldtom/app || exit 1
            docker compose --env-file /opt/oldtom/oldtom.env -f docker-compose.yml -f docker-compose.production.yml pull
            docker compose --env-file /opt/oldtom/oldtom.env -f docker-compose.yml -f docker-compose.production.yml up -d --remove-orphans
