name: Trigger certbot renew on server

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger remote certbot renew
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/oldtom/app
            docker compose --env-file /opt/oldtom/oldtom.env -f docker-compose.yml -f docker-compose.production.yml --profile certbot run --rm certbot-renew || true
            docker compose --env-file /opt/oldtom/oldtom.env -f docker-compose.yml -f docker-compose.production.yml exec -T nginx nginx -s reload || true
